name: CI
on:
  pull_request:
  push:
    branches: [main, codex/implementation]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
        env:
          POSTGRES_PASSWORD: fixture-ci-only
          POSTGRES_DB: ai_builder_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_builder_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps --no-build-isolation .
      - name: Static and dependency checks
        run: |
          pip check
          python -m compileall -q src
          git diff --check
          for script in deploy/*.sh; do bash -n "$script"; done
      - name: Tests with PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-ci-only@localhost:5432/ai_builder_test
          TEST_DEPLOY_ADMIN_DSN: postgresql://postgres:fixture-ci-only@localhost:5432/ai_builder_test
        run: python -m pytest -q
      - name: Build target image
        run: docker build --platform linux/amd64 --label org.opencontainers.image.revision="$GITHUB_SHA" --label io.ai-builder.deploy-bundle-sha256="$(bash deploy/bundle-hash.sh)" -t ai-builder-ci:tested .
      - name: Container smoke, restart and restore
        run: sudo --preserve-env=PATH,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT bash deploy/ci-smoke.sh ai-builder-ci:tested
      - name: Encrypted export and deploy-user permissions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          sudo --preserve-env=PATH,GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT bash deploy/ci-export-smoke.sh
