[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-business-builder"
version = "0.1.0"
description = "Evidence-based business model research"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "pydantic", "httpx", "jinja2", "psycopg[binary,pool]", "langgraph", "langgraph-checkpoint-postgres"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.setuptools.package-data]
ai_builder = ["migrations/*.sql"]
